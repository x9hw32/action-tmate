name: SSH to Runner

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Операционная система раннера'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - 'ubuntu-latest'
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'

jobs:
  ssh:
    name: Interactive SSH Session
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
