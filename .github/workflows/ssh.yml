name: SSH to Runner

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Выбор машины / ОС'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - 'ubuntu-latest'
          - 'ubuntu-24.04-arm'
          - 'ubuntu-22.04-arm'
          - 'arm64-linux-qemu'
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'
          - 'macos-15'
          - 'macos-14'
          - 'macos-13'
          - 'windows-latest'
          - 'windows-11-arm'
          - 'windows-2022'
          - 'custom'
      custom_runner:
        description: 'Если выбран "custom", введи имя раннера (например self-hosted или кастомный тег)'
        required: false
        default: ''
        type: string
      container:
        description: 'Docker-контейнер (оставь пустым для обычной ОС, либо введи: archlinux:latest, fedora:latest, debian:latest, ubuntu:latest, alpine:latest, kalilinux/kali-rolling)'
        required: false
        default: ''
        type: string
      maximize_disk:
        description: 'Очистить диск от мусора (освобождает до ~65-70 GB на Ubuntu)'
        required: false
        default: true
        type: boolean

jobs:
  host-session:
    name: SSH on Host
    if: ${{ !inputs.container && inputs.runner != 'arm64-linux-qemu' }}
    runs-on: ${{ inputs.runner == 'custom' && inputs.custom_runner || inputs.runner }}
    steps:
      - name: Free up disk space
        if: ${{ inputs.maximize_disk && runner.os == 'Linux' }}
        run: |
          echo "=== Диск до очистки ==="
          df -h /
          echo "Удаление предустановленных тяжелых SDK (Android, .NET, Haskell, Azure, Boost)..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/az /usr/local/share/boost /usr/local/share/powershell 2>/dev/null || true
          sudo docker image prune -a -f 2>/dev/null || true
          echo "=== Диск после очистки ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true

  container-session:
    name: SSH in Container (${{ inputs.container }})
    if: ${{ inputs.container && inputs.runner != 'arm64-linux-qemu' }}
    runs-on: ${{ inputs.runner == 'custom' && inputs.custom_runner || inputs.runner }}
    container:
      image: ${{ inputs.container }}
    steps:
      - name: Install dependencies in container
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y openssh-client curl git sudo
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm openssh curl git sudo
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y openssh-clients curl git sudo
          elif command -v apk >/dev/null 2>&1; then
            apk add openssh-client curl git sudo bash
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true

  arm64-qemu-session:
    name: SSH in ARM64 Linux (QEMU aarch64)
    if: ${{ inputs.runner == 'arm64-linux-qemu' }}
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        if: ${{ inputs.maximize_disk }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/az /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Setup QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run inside ARM64 Linux Docker container
        run: |
          IMAGE="${{ inputs.container || 'arm64v8/ubuntu:24.04' }}"
          echo "Запуск ARM64 контейнера: $IMAGE"
          docker run -d --name arm_box --platform linux/arm64 \
            -v /home/runner:/home/runner \
            -w /root \
            $IMAGE sleep infinity

          echo "=== Проверка архитектуры в контейнере ==="
          docker exec arm_box uname -m

          echo "Установка пакетов и upterm в ARM64..."
          docker exec arm_box bash -c '
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y openssh-client curl git sudo tmux
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Syu --noconfirm openssh curl git sudo tmux
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y openssh-clients curl git sudo tmux
            elif command -v apk >/dev/null 2>&1; then
              apk add openssh-client curl git sudo bash tmux
            fi
            curl -sL https://github.com/owenthereal/upterm/releases/latest/download/upterm_linux_arm64.tar.gz | tar -xz -C /usr/local/bin upterm
            chmod +x /usr/local/bin/upterm
          '

          echo "Добавление твоего SSH-ключа..."
          mkdir -p ~/.ssh
          curl -sL https://github.com/x9hw32.keys >> ~/.ssh/authorized_keys
          docker cp ~/.ssh/authorized_keys arm_box:/root/.ssh_keys
          docker exec arm_box bash -c 'mkdir -p ~/.ssh && cat /root/.ssh_keys >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && chmod 700 ~/.ssh'

          echo "Запуск upterm в контейнере..."
          docker exec -d arm_box bash -c 'upterm host --force-command "bash" --server "ssh://uptermd.upterm.dev:22" --authorized-key ~/.ssh/authorized_keys'

          sleep 5
          for i in {1..10}; do
            SSH_URL=$(docker exec arm_box upterm session current 2>/dev/null | grep -i 'SSH Session:' | sed 's/.*SSH Session:[[:space:]]*//' | tr -d '\r\n')
            if [ -n "$SSH_URL" ]; then
              break
            fi
            sleep 2
          done

          echo "## 🚀 Настоящий ARM64 Linux (aarch64) готов!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Архитектура: \`$(docker exec arm_box uname -m)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 Команда для подключения:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "$SSH_URL" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "=========================================================="
          echo "  ARM64 SSH: $SSH_URL"
          echo "=========================================================="

          while [ ! -f /continue ]; do
            sleep 5
          done
